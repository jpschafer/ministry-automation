name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The YouTube scripts use `X | None` hints, so 3.10 is the floor.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint requests -r requirements.txt -r youtube/upload_watcher/requirements.txt
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py' ':!:sexton/**')
    - name: Run RCL Reg
      run: |
        cd ./rcl
        python3 rcl_reg.py
